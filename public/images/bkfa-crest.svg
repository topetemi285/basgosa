<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="topTextPath" d="M 28 100 A 72 72 0 0 1 172 100" fill="none" />
    <path id="bottomTextPath" d="M 172 100 A 72 72 0 0 1 28 100" fill="none" />
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFA040" />
      <stop offset="50%" stopColor="#FF6B00" />
      <stop offset="100%" stopColor="#D94B00" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#559910" />
      <stop offset="50%" stopColor="#76C816" />
      <stop offset="100%" stopColor="#559910" />
    </linearGradient>
  </defs>

  <!-- Outermost Ring (Black) -->
  <circle cx="100" cy="100" r="98" fill="#0A0E1A" stroke="#000000" stroke-width="2" />

  <!-- Orange Ring Border -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#FF6B00" stroke-width="6" />

  <!-- White Outer Band -->
  <circle cx="100" cy="100" r="88" fill="#FFFFFF" stroke="#0A0E1A" stroke-width="2.5" />

  <!-- Inner Circle (Black Backdrop) -->
  <circle cx="100" cy="100" r="62" fill="#0A0E1A" stroke="#0A0E1A" stroke-width="2" />

  <!-- Outer Ring Text: Top: BLESSED KAA FOOTBALL ACADEMY -->
  <text fill="#0A0E1A" font-size="11" font-weight="900" letter-spacing="0.8" font-family="'Outfit', sans-serif">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
      BLESSED KAA FOOTBALL ACADEMY
    </textPath>
  </text>

  <!-- Outer Ring Text: Bottom: THE LIGHT THAT CAN NOT BE HIDDEN -->
  <text fill="#0A0E1A" font-size="7.5" font-weight="800" letter-spacing="1" font-family="'Outfit', sans-serif">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
      • THE LIGHT THAT CAN NOT BE HIDDEN •
    </textPath>
  </text>

  <!-- Top Text Inside Circle: BKFA in Lemon Green -->
  <text x="100" y="65" text-anchor="middle" fill="#76C816" font-size="22" font-weight="900" font-family="'Outfit', sans-serif" letter-spacing="1">
    BKFA
  </text>

  <!-- Orange Wings Left -->
  <g fill="url(#wingGrad)">
    <path d="M 68 100 C 50 85 45 68 55 65 C 62 65 65 80 72 94 Z" />
    <path d="M 66 106 C 45 95 40 82 48 78 C 55 78 60 90 68 102 Z" />
    <path d="M 68 114 C 48 108 45 98 52 94 C 58 94 62 104 70 110 Z" />
  </g>

  <!-- Orange Wings Right -->
  <g fill="url(#wingGrad)">
    <path d="M 132 100 C 150 85 155 68 145 65 C 138 65 135 80 128 94 Z" />
    <path d="M 134 106 C 155 95 160 82 152 78 C 145 78 140 90 132 102 Z" />
    <path d="M 132 114 C 152 108 155 98 148 94 C 142 94 138 104 130 110 Z" />
  </g>

  <!-- Center Football Ball -->
  <g>
    <circle cx="100" cy="102" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
    <polygon points="100,92 110,99 106,110 94,110 90,99" fill="#0A0E1A" />
    <line x1="100" y1="92" x2="100" y2="81" stroke="#0A0E1A" stroke-width="2" />
    <line x1="110" y1="99" x2="119" y2="94" stroke="#0A0E1A" stroke-width="2" />
    <line x1="106" y1="110" x2="114" y2="120" stroke="#0A0E1A" stroke-width="2" />
    <line x1="94" y1="110" x2="86" y2="120" stroke="#0A0E1A" stroke-width="2" />
    <line x1="90" y1="99" x2="81" y2="94" stroke="#0A0E1A" stroke-width="2" />
  </g>

  <!-- Green Ribbon / Banner with "THE CONQUERORS" -->
  <path d="M 64 130 Q 100 138 136 130 L 140 138 Q 100 146 60 138 Z" fill="url(#ribbonGrad)" stroke="#4D7C0F" stroke-width="0.8" />
  <polygon points="60,138 52,132 55,144 64,136" fill="#4D7C0F" />
  <polygon points="140,138 148,132 145,144 136,136" fill="#4D7C0F" />

  <text x="100" y="136" text-anchor="middle" fill="#FFFFFF" font-size="6" font-weight="900" letter-spacing="0.8" font-family="'Outfit', sans-serif">
    THE CONQUERORS
  </text>

  <!-- Bottom Text: SINCE 2014 -->
  <text x="100" y="152" text-anchor="middle" fill="#FFFFFF" font-size="8" font-weight="800" letter-spacing="1" font-family="'Outfit', sans-serif">
    SINCE 2014
  </text>
</svg>
